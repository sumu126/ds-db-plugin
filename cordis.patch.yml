# The layer this bundle contributes: the plugin itself — the dialect registry and
# the read-only tools.
#
# No database type is declared here. Each dialect is a bundle of its own (MySQL
# is `dsh-dialect-mysql`), installed after this one, and a third party's dialect
# is installed the same way: this plugin names no default type, so every type
# arrives through the same seam. Until one is installed the settings page offers
# the known types as "coming soon" with the package that would provide them, and
# a tool call answers with the refusal that names what is registered.
- insert:
    - id: ds-db
      name: 'dsh-ds-db'
      config:
        # The dialect the connections address. Every registered dialect is
        # selectable per connection on the settings page.
        dialect: mysql
        host: 127.0.0.1
        port: 3306
        user: root
        database: ''
        # Credential reference holding the account password; the database
        # settings page writes the literal into the credential store under this
        # name, and only that name reaches the settings document.
        passwordEnv: DSH_MYSQL_PASSWORD
        connectTimeoutMs: 10000
        queryTimeoutMs: 30000
        maxRows: 200
        # Saved connections a deployment preprovisions. The flat fields above
        # describe the single connection a deployment gets when this is absent.
        connections: []
        activeId: ''