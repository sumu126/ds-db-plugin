# The layer this bundle contributes: the plugin itself, and the dialect package
# that gives it MySQL.
#
# The dialect is its own plugin row, exactly like a third party's would be: the
# core provides the registry and ships no database type, so MySQL arrives here
# the same way any other type does. Dialect packages load before the core row so
# the tool descriptions are written from a dialect that is already registered.
- insert:
    - id: dialect-mysql
      name: 'dsh-dialect-mysql'
    - id: ds-db
      name: 'dsh-ds-db'
      config:
        # The dialect the connections address. Every registered dialect is
        # selectable per connection on the settings page.
        dialect: mysql
        host: 127.0.0.1
        port: 3306
        user: root
        database: ''
        # Credential reference holding the account password; the database
        # settings page writes the literal into the credential store under this
        # name, and only that name reaches the settings document.
        passwordEnv: DSH_MYSQL_PASSWORD
        connectTimeoutMs: 10000
        queryTimeoutMs: 30000
        maxRows: 200
        # Saved connections a deployment preprovisions. The flat fields above
        # describe the single connection a deployment gets when this is absent.
        connections: []
        activeId: ''
