# The core plugin is the workspace root; each dialect under dialects/ is a
# package of its own, so a dialect resolves the plugin API by package name the
# same way an out-of-tree dialect does.
#
# `_template` is a starting point rather than a package, so it is not a member.
packages:
  - .
  - dialects/*
  - '!dialects/_template'

# esbuild's install script only selects its platform binary; pnpm ≥10 refuses
# to run an unlisted build script, and the client and dialect bundles need it.
allowBuilds:
  esbuild: true

# pnpm installs missing peers by default, and every peer this plugin declares is
# a harness package the *running host* provides and npm does not have. Automatic
# installation therefore fails on `@deepseek-ai/dsh-*` before it can do anything
# useful — which is also why the README's install step is pnpm and not npm.
autoInstallPeers: false
